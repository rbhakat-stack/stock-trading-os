[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-os"
version = "0.1.0"
description = "Personal Trading Operating System — Phase 1 (Market Reader)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["engine*", "repository*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
